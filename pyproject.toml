[project]
name = "ya-agent"
version = "0.1.0"
description = "Python-based manufacturing after-sales ticket agent prototype"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ya-agent = "ya_agent:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
